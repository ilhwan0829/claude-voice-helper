plugins {
    id "com.android.application"
}

android {
    namespace "kr.ilhwan.claudevoice"
    compileSdk 34

    defaultConfig {
        applicationId "kr.ilhwan.claudevoice"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    // 모든 빌드를 같은 키로 서명해야 폰에서 '업데이트'로 설치된다.
    signingConfigs {
        helper {
            storeFile file("helper.keystore")
            storePassword "claudehelper"
            keyAlias "helper"
            keyPassword "claudehelper"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.helper }
        release { signingConfig signingConfigs.helper }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
